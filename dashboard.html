<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电脑舰队管理台</title>
<style>
  :root{--bg:#0b0c0e;--panel:#181b1f;--panel2:#1f232a;--txt:#d8dee9;--dim:#8b949e;--grid:#2c2f33;--ok:#2fbf71;--bad:#e5534b;--warn:#e8a13a;--line:#2c2f33}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 12px 30px}
  header{max-width:1240px;margin:0 auto 12px}
  h1{font-size:21px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .toolbar{max-width:1240px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar input{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px 12px;font-size:14px;outline:none}
  .toolbar input:focus{border-color:var(--dim)}
  .fbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:6px 13px;font-size:13px;cursor:pointer}
  .fbtn.on{background:var(--panel2);color:var(--txt);border-color:var(--dim)}
  .refreshbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
  .statrow{max-width:1240px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:1000px){.statrow{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.statrow{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .stat .lbl{font-size:12px;color:var(--dim)}
  .stat .val{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .val small{font-size:13px;color:var(--dim);font-weight:400}
  .stat .val.red{color:var(--bad)} .stat .val.green{color:var(--ok)} .stat .val.yellow{color:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 auto 12px;max-width:1240px}
  .panel.alert{border-color:var(--bad)}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .ptitle{font-size:15px;font-weight:700}
  .psub{font-size:12px;color:var(--dim);margin-top:2px}
  .status{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .st-on{background:rgba(47,191,113,.16);color:var(--ok)}
  .st-off{background:rgba(229,83,75,.16);color:var(--bad)}
  .st-none{background:rgba(143,163,184,.16);color:var(--dim)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--dim);margin-bottom:8px}
  .legend span{white-space:nowrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  .chart{width:100%;display:block}
  .chart text{font-size:11px;fill:var(--dim)}
  .pstats{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-bottom:8px}
  .pstats b{font-variant-numeric:tabular-nums}
  .machgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  @media(max-width:900px){.machgrid{grid-template-columns:1fr}}
  .machgrid .panel{margin:0;max-width:none}
  .machgrid .panel.off{opacity:.62}
  .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
  .bar>i.mid{background:var(--warn)} .bar>i.hi{background:var(--bad)}
  .rowlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:9px;gap:8px}
  .rowlbl b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sec{margin-top:10px;border-top:1px solid var(--grid);padding-top:9px}
  .sec h3{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:6px}
  .task{display:flex;justify-content:space-between;font-size:13px;padding:2.5px 0;gap:8px}
  .task .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .tv{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;border-radius:999px;padding:3.5px 9px;background:var(--panel2);border:1px solid var(--line)}
  .chip.up{color:var(--ok)} .chip.down{color:var(--bad)}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .chip.up .dot{background:var(--ok)} .chip.down .dot{background:var(--bad)}
  .foot{color:var(--dim);font-size:11.5px;margin-top:10px;line-height:1.6}
  .empty{color:var(--dim);font-size:13px;padding:8px 0 2px}
  .noresult{max-width:1240px;margin:0 auto;color:var(--dim);font-size:14px;padding:24px 4px}
  #alertbar{display:none;max-width:1240px;margin:0 auto 12px;background:rgba(229,83,75,.15);border:1px solid var(--bad);color:#ffb4ae;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🖥️ 电脑舰队管理台</h1>
  <div class="sub" id="sub">加载中…</div>
  <div style="margin-top:4px"><a href="logout" style="color:var(--dim);font-size:12.5px;text-decoration:none">退出登录</a></div>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="搜索机器名 / 编号 / 用途…" autocomplete="off">
  <button class="fbtn on" data-f="all">全部</button>
  <button class="fbtn" data-f="on">在线</button>
  <button class="fbtn" data-f="off">离线</button>
  <button class="fbtn" data-f="alert">有告警</button>
  <button class="refreshbtn" onclick="refresh()">立即刷新</button>
  <span style="font-size:12px;color:var(--dim)">每 30 秒自动刷新 · 趋势图为打开页面后累计</span>
</div>
<div id="alertbar"></div>
<div class="statrow" id="statrow"></div>
<div class="panel" id="fleetpanel"></div>
<div class="panel" id="diskpanel"></div>
<div class="machgrid" id="machgrid"></div>
<div class="noresult" id="noresult" style="display:none">没有匹配的机器，换个关键词或筛选条件试试。</div>
<script>
function gb(n){return (n/1073741824).toFixed(1)+' GB'}
function pct(n){return n.toFixed(0)+'%'}
function barCls(v){return v>=90?'hi':(v>=70?'mid':'')}
function ago(sec){if(sec<0)sec=0;if(sec<60)return sec+' 秒前';if(sec<3600)return Math.floor(sec/60)+' 分钟前';if(sec<86400)return Math.floor(sec/3600)+' 小时前';return Math.floor(sec/86400)+' 天前'}
function uptimeStr(s){if(!s)return '—';var d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d>0?('已运行 '+d+' 天 '+h+' 小时'):('已运行 '+h+' 小时')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var PALETTE=['#2fbf71','#4da3ff','#e8a13a','#b678f0','#e5534b','#2dd4bf','#f472b6','#a3e635'];
var hist={};
function pushHist(id, cpu, mem){var a=hist[id]||(hist[id]={cpu:[],mem:[]});a.cpu.push(cpu);a.mem.push(mem);if(a.cpu.length>48){a.cpu.shift();a.mem.shift();}}
function timeChart(series, h){
  h=h||150;var W=640,H=h,PL=34,PR=8,PT=8,PB=18,iw=W-PL-PR,ih=H-PT-PB;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  [0,25,50,75,100].forEach(function(v){var y=PT+ih*(100-v)/100;s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#2c2f33" stroke-width="1"/><text x="'+(PL-4)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';});
  series.forEach(function(sr){
    var pts=sr.points;
    if(pts.length<2)return;
    var xy=pts.map(function(v,i){var x=PL+i*iw/Math.max(1,pts.length-1);var y=PT+ih*(100-Math.min(100,Math.max(0,v)))/100;return x.toFixed(1)+','+y.toFixed(1)}).join(' ');
    s+='<polygon points="'+PL+','+(PT+ih)+' '+xy+' '+(W-PR)+','+(PT+ih)+'" fill="'+sr.color+'" opacity="0.12"/>';
    s+='<polyline points="'+xy+'" fill="none" stroke="'+sr.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  s+='</svg>';
  return s;
}
function legendHTML(series){
  return '<div class="legend">'+series.map(function(sr){return '<span><i style="background:'+sr.color+'"></i>'+esc(sr.label)+' <b style="color:#d8dee9">'+pct(sr.value)+'</b></span>'}).join('')+'</div>';
}

var curFilter='all', curQuery='';
document.querySelectorAll('.fbtn').forEach(function(b){b.addEventListener('click',function(){curFilter=b.getAttribute('data-f');document.querySelectorAll('.fbtn').forEach(function(x){x.classList.toggle('on',x===b)});render();});});
document.getElementById('q').addEventListener('input',function(e){curQuery=e.target.value.trim().toLowerCase();render();});
var lastData=null;
function shownMachines(){
  var ms=(lastData&&lastData.machines)||[], q=curQuery;
  var shown=ms.filter(function(m){
    var info=m.info||{};
    if(curFilter==='on'&&!(m.report&&m.online))return false;
    if(curFilter==='off'&&!((m.report&&!m.online)||!m.report))return false;
    if(curFilter==='alert'&&!m.alert)return false;
    if(q){
      var hay=((info.name||'')+' '+(info.id||'')+' '+(info.role||'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
  shown.sort(function(a,b){
    var sa=(a.alert||(a.report&&!a.online))?0:1, sb=(b.alert||(b.report&&!b.online))?0:1;
    if(sa!==sb)return sa-sb;
    return String((a.info&&a.info.name)||'').localeCompare(String((b.info&&b.info.name)||''));
  });
  return shown;
}
function render(){
  if(!lastData)return;
  var now=lastData.now, shown=shownMachines();
  var on=0, alerts=0, cpuSum=0, cpuN=0, memSum=0, memN=0, worstDisk=0, worstName='';
  shown.forEach(function(m){
    if(m.report&&m.online)on++;
    if(m.alert)alerts++;
    if(m.report&&m.report.agent){cpuSum+=m.report.cpu||0;cpuN++;if(m.report.mem_total>0){memSum+=100*m.report.mem_used/m.report.mem_total;memN++;}}
    (m.report&&m.report.disks||[]).forEach(function(d){var p=d.total>0?100*(d.total-d.free)/d.total:0;if(p>worstDisk){worstDisk=p;worstName=m.info.name;}});
  });
  var avgCpu=cpuN?cpuSum/cpuN:0, avgMem=memN?memSum/memN:0;
  var ab=document.getElementById('alertbar');
  var alertMs=shown.filter(function(m){return m.alert});
  if(alertMs.length){
    ab.style.display='block';
    ab.innerHTML='⚠️ <b>告警</b>：'+alertMs.map(function(m){return esc(m.info.name)+' 已离线 '+ago(now-(m.last_seen||now))}).join('；');
  } else { ab.style.display='none'; }
  document.getElementById('statrow').innerHTML=
    '<div class="stat"><div class="lbl">在线机器</div><div class="val green">'+on+' <small>/ '+shown.length+' 台</small></div></div>'+
    '<div class="stat"><div class="lbl">告警机器</div><div class="val '+(alerts?'red':'')+'">'+alerts+' <small>台</small></div></div>'+
    '<div class="stat"><div class="lbl">平均 CPU</div><div class="val">'+pct(avgCpu)+'</div></div>'+
    '<div class="stat"><div class="lbl">平均内存占用</div><div class="val">'+pct(avgMem)+'</div></div>'+
    '<div class="stat"><div class="lbl">磁盘最满</div><div class="val '+(worstDisk>=90?'red':(worstDisk>=70?'yellow':''))+'">'+pct(worstDisk)+'<small> '+esc(worstName)+'</small></div></div>'+
    '<div class="stat"><div class="lbl">数据时间</div><div class="val" style="font-size:17px;padding-top:6px">'+new Date(now*1000).toLocaleString('zh-CN',{hour12:false})+'</div></div>';
  var fleetSeries=shown.map(function(m,i){
    var h=hist[(m.info&&m.info.id)||'']||{cpu:[]};
    return {label:(m.info&&m.info.name)||'', color:PALETTE[i%PALETTE.length], points:h.cpu, value:(m.report&&m.report.cpu)||0};
  });
  document.getElementById('fleetpanel').innerHTML=
    '<div class="phead"><div><div class="ptitle">舰队 CPU 使用率</div><div class="psub">每台机器一条线 · 最近 '+(Math.max.apply(null, fleetSeries.map(function(s){return s.points.length}))||0)+' 次刷新</div></div></div>'+
    legendHTML(fleetSeries)+timeChart(fleetSeries, 170);
  var diskRows=shown.map(function(m){
    var worst=null, worstP=-1;
    (m.report&&m.report.disks||[]).forEach(function(d){var p=d.total>0?100*(d.total-d.free)/d.total:0;if(p>worstP){worstP=p;worst=d;}});
    if(!worst)return '';
    return '<div class="rowlbl"><span>'+esc(m.info.name)+' · '+esc(worst.mount)+'</span><b>已用 '+pct(worstP)+'（可用 '+gb(worst.free)+' / '+gb(worst.total)+'）</b></div><div class="bar"><i class="'+barCls(worstP)+'" style="width:'+worstP+'%"></i></div>';
  }).join('');
  document.getElementById('diskpanel').innerHTML='<div class="phead"><div class="ptitle">磁盘使用（每台最满的一块）</div></div>'+(diskRows||'<div class="empty">暂无磁盘数据。</div>');
  document.getElementById('machgrid').innerHTML=shown.map(function(m){return machPanel(m, now)}).join('');
  document.getElementById('noresult').style.display=shown.length?'none':'block';
}
function machPanel(m, now){
  var info=m.info||{}, rep=m.report, last=m.last_seen||0;
  var has=!!rep, online=has&&m.online;
  var statusCls=!has?'st-none':(online?'st-on':'st-off');
  var statusTxt=!has?'待接入':(online?'● 在线':'● 离线');
  var h='<div class="panel'+(has&&!online?' off':'')+(m.alert?' alert':'')+'">';
  h+='<div class="phead"><div><div class="ptitle">'+esc(info.name||info.id)+'</div><div class="psub">'+esc(info.id)+' · '+esc(info.role||'')+'</div></div><div class="status '+statusCls+'">'+statusTxt+'</div></div>';
  if(!has){
    h+='<div class="empty">这台还没有接入监控。</div>';
  } else if(!rep.agent){
    h+='<div class="sec"><h3>软件在线情况</h3><div class="chips">';
    (rep.services||[]).forEach(function(s){h+='<span class="chip '+(s.up?'up':'down')+'"><span class="dot"></span>'+esc(s.name)+(s.detail?' '+esc(s.detail):'')+'</span>'});
    h+='</div></div>';
    h+='<div class="foot">远程探测（未装探针） · 更新于 '+ago(now-last)+'</div>';
  } else {
    var mp=rep.mem_total>0?100*rep.mem_used/rep.mem_total:0;
    var hh=hist[info.id]||{cpu:[],mem:[]};
    h+='<div class="pstats"><span>CPU <b>'+pct(rep.cpu||0)+'</b></span><span>内存 <b>'+pct(mp)+'</b></span><span>更新于 '+ago(now-last)+'</span></div>';
    h+=legendHTML([{label:'CPU',color:'#2fbf71',value:rep.cpu||0},{label:'内存',color:'#4da3ff',value:mp}]);
    h+=timeChart([{label:'CPU',color:'#2fbf71',points:hh.cpu,value:rep.cpu||0},{label:'内存',color:'#4da3ff',points:hh.mem,value:mp}], 130);
    if((rep.disks||[]).length){
      h+='<div class="sec"><h3>磁盘可用空间</h3>';
      rep.disks.forEach(function(d){
        var usedp=d.total>0?100*(d.total-d.free)/d.total:0;
        h+='<div class="rowlbl"><span>'+esc(d.mount)+'</span><b>可用 '+gb(d.free)+' / '+gb(d.total)+'（已用 '+pct(usedp)+'）</b></div>';
        h+='<div class="bar"><i class="'+barCls(usedp)+'" style="width:'+usedp+'%"></i></div>';
      });
      h+='</div>';
    }
    if((rep.top||[]).length){
      h+='<div class="sec"><h3>主要工作任务（按 CPU）</h3>';
      rep.top.slice(0,5).forEach(function(t){
        h+='<div class="task"><span class="tn">'+esc(t.name)+'</span><span class="tv">CPU '+pct(t.cpu)+(t.mem>=1?' · 内存 '+pct(t.mem):'')+'</span></div>';
      });
      h+='</div>';
    }
    if((rep.services||[]).length){
      h+='<div class="sec"><h3>软件在线情况</h3><div class="chips">';
      rep.services.forEach(function(s){h+='<span class="chip '+(s.up?'up':'down')+'"><span class="dot"></span>'+esc(s.name)+'</span>'});
      h+='</div></div>';
    }
    h+='<div class="foot">'+esc(rep.hostname||'')+' · '+esc(rep.os||'')+' · '+uptimeStr(rep.uptime)+'<br>更新于 '+ago(now-last)+'</div>';
  }
  h+='</div>';
  return h;
}
function refresh(){
  fetch('api/state').then(function(r){if(r.status===401){location.href='login';throw new Error('unauth')}return r.json()}).then(function(data){
    lastData=data;
    (data.machines||[]).forEach(function(m){
      if(m.report&&m.report.agent)pushHist(m.info.id, m.report.cpu||0, m.report.mem_total>0?100*m.report.mem_used/m.report.mem_total:0);
    });
    document.getElementById('sub').textContent='数据时间：'+new Date(data.now*1000).toLocaleString('zh-CN',{hour12:false});
    render();
  }).catch(function(e){
    document.getElementById('sub').textContent='刷新失败，稍后自动重试';
  });
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
